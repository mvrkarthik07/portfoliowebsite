[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/experience"
  to = "/#exp"
  status = 301
[[redirects]]
  from = "/resume"
  to = "/resume.pdf"
  status = 301
[[redirects]]
  from = "/posters"
  to = "/archive"
  status = 301
[[redirects]]
  from = "/contact"
  to = "/#msg"
  status = 301
[[redirects]]
  from = "/work"
  to = "/#work"
  status = 301
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
[[headers]]
  for = "/posters/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
