<!doctype html>
<html lang="en">
<head><meta charset="utf-8" /><meta name="robots" content="noindex" /><title>Contact form</title></head>
<body>
  <form name="portfolio-contact" method="POST" data-netlify="true" data-netlify-honeypot="bot-field">
    <p><label>Name <input name="name" /></label></p>
    <p><label>Email <input type="email" name="email" /></label></p>
    <p><label>Subject <input name="subject" /></label></p>
    <p><label>Message <textarea name="message"></textarea></label></p>
    <p><label>Leave blank <input name="bot-field" /></label></p>
    <button type="submit">Send</button>
  </form>
</body>
</html>
